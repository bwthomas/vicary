[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vicary"
description = "Offline redaction of personal names in student compositions"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Blake Thomas", email = "bwthomas@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["redaction", "anonymization", "privacy", "education", "names"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

# No runtime dependencies, deliberately. The redaction path is stdlib-only: no
# model, no network, no cloud client. Everything optional is an extra, so a host
# that only wants the offline detector installs exactly that.
dependencies = []

# Keep this table LAST in [project]. A TOML sub-table swallows every key after
# it, so `[project.urls]` placed above `dependencies` reads it as a URL and the
# build fails with `project.urls.dependencies must be string`.
#
# Three links, the same three each front door declares: the repository, the
# changelog, the issue tracker. No separate `Repository` key — it would be the
# homepage again, which is the redundancy `gem build` warns about on the Ruby
# side. The homepage IS the source here.
[project.urls]
Homepage = "https://github.com/bwthomas/vicary"
Changelog = "https://github.com/bwthomas/vicary/blob/main/CHANGELOG.md"
Issues = "https://github.com/bwthomas/vicary/issues"

[project.optional-dependencies]
# The AWS Bedrock Guardrail arm (an alternative detector and the eval's external
# baseline), plus the script that provisions the Guardrail resource.
bedrock = ["boto3>=1.34"]
# Everything needed to run the gates and the eval report.
eval = ["pytest>=8"]
dev = [
    "pytest>=8",
    "mypy>=1.8",
    "ruff>=0.5",
    "build>=1.0",
    # `just py-build` runs `python -m twine check` on what `build` produced, so
    # twine belongs in the same extra that installs `build`. It was omitted, and
    # `just py-setup && just py-build` on a fresh clone therefore died at the
    # check step with `No module named twine`.
    "twine>=5.0",
]

[project.scripts]
# Inspect, verify, or rebuild the bundled data asset.
vicary-assets = "vicary.assets:main"
# Run the recall/precision measurement and print the table.
vicary-eval = "vicary.eval.recall:main"

[tool.setuptools.dynamic]
version = { attr = "vicary._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The gazetteer asset and its checksum manifest. This line is the whole reason
# packaging was worth doing: the asset used to reach deployment through a
# build-time copy allowlist that had already silently dropped a runtime file
# once. Package data cannot be forgotten.
# `data/` is a VENDORED copy, reproduced from the repository's `asset/` by
# `just asset-sync` and gitignored like every other front door's. So a wheel built
# without that step ships no gazetteer and no stoplist, and loads empty — which
# means redacting every public figure in every essay. Two guards, because this one
# is worth two: `tests/test_packaging.py` asserts the files are present in the
# working tree, and CI's python-build job greps the built wheel for them.
vicary = ["data/*.txt.gz", "data/*.txt", "data/MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `gates` is the measurement suite: slower than the unit tests, and the
# corpus-dependent parts skip when no corpus is configured. Run everything with
# plain `pytest`; run just the fast tests with `-m "not gates"`.
markers = [
    "gates: measured quality gates rather than unit assertions",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/vicary"]
ignore_missing_imports = true
