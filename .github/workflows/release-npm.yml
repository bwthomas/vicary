# Publish the npm package when a `v*` tag is pushed.
#
# Same trust story as the Python and Ruby releases, and now literally: **no token
# in this repository at all.** Authentication is OIDC trusted publishing, and
# `--provenance` mints the attestation from the same identity, so the published
# tarball carries a verifiable link back to this commit and this workflow.
#
# The `NPM_TOKEN` secret that used to be here is deleted, from npm and from this
# repository. It was a classic Publish token, which still demands a 2FA OTP that CI
# cannot supply: the v0.2.0 run signed provenance, published it to the sigstore
# transparency log, and *then* failed with `EOTP`. The bypass-2FA automation token
# would have worked and is exactly the long-lived unattended credential this header
# claims not to have, so it was not the fix.
#
# The package is `@bwthomas/vicary`, scoped. npm's typosquat filter refuses the
# unscoped `vicary` as too similar to the existing `vary` — a name owned by nobody,
# so it reads as available in any 404 check and is not. An appeal is open; PyPI and
# RubyGems carry the unscoped name.
#
# THE GATE THAT MATTERS IS CONFORMANCE, NOT THE TESTS.
#
# A port that publishes while it reproduces 0 of 38 masking-required frames is a
# package called `vicary` that does not redact — worse than no package, because a
# host that installs it gets silence instead of an error. So this workflow refuses
# to publish unless the conformance scoreboard reports every masking-required frame
# matching the reference output byte-for-byte. It reads the number off the
# scoreboard rather than trusting an exit code, and it stays exactly as strict now
# that the number is 38 of 38: the gate is what keeps a regression from shipping,
# not what was keeping an unfinished port from shipping.
name: release-npm

# The tag trigger is back, because the reason it was removed is gone. It was
# manual-dispatch only while the detector was unported: the conformance gate below
# would have refused on every `v*` tag, which is a permanent red check on every
# Python release, and "is the release green?" stops having an answer. The port now
# reproduces 38 of 38 masking-required frames, so the gate passes on its own merits
# rather than being routed around. The gate itself never moved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 and an explicit npm upgrade, because OIDC trusted publishing needs
      # npm >= 11.5.1 and no Node line bundles that by default on a schedule we
      # control. Pinning `"22"` bundled npm 10.x, which does not attempt the OIDC
      # exchange at all — it falls back to looking for a token, finds none, and
      # fails as though the credential were wrong rather than as though the client
      # were too old. The version print is here so the log answers that question
      # without a re-run.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: npm must be new enough to attempt OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          npm --version | awk -F. '$1 < 11 || ($1 == 11 && $2 == 5 && $3 < 1) {
            print "npm " $0 " is too old to attempt the OIDC exchange"; exit 1 }'

      - run: npm ci

      - name: The tag must be the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" \
            || { echo "tag $GITHUB_REF_NAME is version $tag, package is $pkg"; exit 1; }

      # The asset, verified by sha256 against the manifest. A gazetteer that reads
      # back empty redacts every public figure in every essay: privacy-safe,
      # product-hostile, and invisible to every other check.
      - name: Vendor the asset
        run: npm run sync-assets

      - run: npm test

      - name: Conformance must be complete before this package may be published
        run: |
          npm run conformance | tee /tmp/conformance.txt
          # Parse the scoreboard's leading line rather than trusting an exit code:
          # the suite passed at 0 of 36 on purpose, because a ratchet that failed
          # the build for being incomplete would make the port unmergeable. The
          # PUBLISH gate is the stricter one, and it reads the number.
          line=$(grep 'frames requiring masking' /tmp/conformance.txt)
          matched=$(echo "$line" | awk '{print $4}')
          total=$(echo "$line" | awk '{print $6}')
          echo "conformance: $matched of $total masking-required frames"
          test -n "$matched" && test -n "$total" \
            || { echo "could not read the scoreboard — refusing to publish on an unparsed number"; exit 1; }
          test "$matched" = "$total" || {
            echo "REFUSING TO PUBLISH: $matched of $total masking-required frames match"
            echo "the reference output. Publishing now would ship a package named"
            echo "vicary that does not redact, and a caller cannot tell."
            exit 1
          }

      - name: The packed tarball must carry the asset
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            for (const need of ["assets/notability.txt.gz", "assets/MANIFEST.json", "assets/stop_words.txt"]) {
              if (!files.includes(need)) {
                console.error(`tarball is missing ${need}`);
                process.exit(1);
              }
            }
            console.log("tarball carries the gazetteer asset");
          '

      # The first version of a new npm name cannot be published from here, and that
      # is npm's constraint rather than a gap in this file: trusted publishing is
      # configured on a package's settings page, so a package that does not exist
      # yet cannot be pre-authorized the way PyPI's pending publishers allow. The
      # first version goes up by hand, with an interactive OTP, so no long-lived
      # credential is ever minted; every version after it comes through here.
      #
      # Which leaves exactly one seam: the tag for that hand-published version
      # still fires this workflow, and `npm publish` on an existing version is a
      # hard error. So this asks the registry first. Skipping is reported loudly and
      # only ever for a version the registry ALREADY serves — it cannot turn a
      # failed publish into a green check, because the only thing it accepts as
      # proof is the version being there.
      - name: Skip if this version was published out of band
        id: already
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry — published out of band."
            echo "This run has nothing to do. It is NOT a substitute for a publish"
            echo "that failed: the check is that the registry serves this version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on the registry; publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN. The secret was a classic Publish token, which demands
      # a 2FA OTP that CI cannot supply — it failed with EOTP after signing
      # provenance — and it has been deleted from npm and from this repository.
      # Authentication is OIDC against the trusted publisher configured on the
      # package, which is why the npm version check above is a hard gate.
      - name: Publish
        if: steps.already.outputs.skip == 'false'
        run: npm publish --provenance --access public
