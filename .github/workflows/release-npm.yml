# Publish the npm package when a `v*` tag is pushed.
#
# Same trust story as the Python and Ruby releases, and now literally: **no token
# in this repository at all.** Authentication is OIDC trusted publishing, and
# `--provenance` mints the attestation from the same identity, so the published
# tarball carries a verifiable link back to this commit and this workflow.
#
# The `NPM_TOKEN` secret that used to be here is deleted, from npm and from this
# repository. It was a classic Publish token, which still demands a 2FA OTP that CI
# cannot supply: the v0.2.0 run signed provenance, published it to the sigstore
# transparency log, and *then* failed with `EOTP`. The bypass-2FA automation token
# would have worked and is exactly the long-lived unattended credential this header
# claims not to have, so it was not the fix.
#
# The package is `@bwthomas/vicary`, scoped. npm's typosquat filter refuses the
# unscoped `vicary` as too similar to the existing `vary` — a name owned by nobody,
# so it reads as available in any 404 check and is not. An appeal is open; PyPI and
# RubyGems carry the unscoped name.
#
# THE GATE THAT MATTERS IS CONFORMANCE, NOT THE TESTS.
#
# A port that publishes while it reproduces 0 of 38 masking-required frames is a
# package called `vicary` that does not redact — worse than no package, because a
# host that installs it gets silence instead of an error. So this workflow refuses
# to publish unless the conformance scoreboard reports every masking-required frame
# matching the reference output byte-for-byte. It reads the number off the
# scoreboard rather than trusting an exit code, and it stays exactly as strict now
# that the number is 38 of 38: the gate is what keeps a regression from shipping,
# not what was keeping an unfinished port from shipping.
name: release-npm

# The tag trigger is back, because the reason it was removed is gone. It was
# manual-dispatch only while the detector was unported: the conformance gate below
# would have refused on every `v*` tag, which is a permanent red check on every
# Python release, and "is the release green?" stops having an answer. The port now
# reproduces 38 of 38 masking-required frames, so the gate passes on its own merits
# rather than being routed around. The gate itself never moved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_probe:
        description: >-
          Prove the trusted-publishing credential without publishing: mint the
          OIDC token and exchange it against the registry for a publish
          credential. Never uploads a tarball. Leave this off for a real release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Say which of the two things this run is
        run: |
          if [ "${{ inputs.publish_probe }}" = "true" ]; then
            echo "PUBLISH PROBE — nothing will be uploaded. This run proves the"
            echo "trusted-publishing credential works and then stops."
          else
            echo "RELEASE — this run publishes if the registry does not already"
            echo "serve this version."
          fi

      # Node 24 and an explicit npm upgrade, because OIDC trusted publishing needs
      # npm >= 11.5.1 and no Node line bundles that by default on a schedule we
      # control. Pinning `"22"` bundled npm 10.x, which does not attempt the OIDC
      # exchange at all — it falls back to looking for a token, finds none, and
      # fails as though the credential were wrong rather than as though the client
      # were too old. The version print is here so the log answers that question
      # without a re-run.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: npm must be new enough to attempt OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          # >= 11.5.1, compared as a number rather than by cases: the first
          # spelling of this only caught 11.5.0 and let 11.0 through 11.4 pass,
          # which is the whole band it existed to reject.
          npm --version | awk -F. '{
            if ($1 * 1000000 + $2 * 1000 + $3 < 11005001) {
              print "npm " $1 "." $2 "." $3 " is too old to attempt the OIDC exchange"
              exit 1
            }
          }'

      - run: npm ci

      - name: The tag must be the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" \
            || { echo "tag $GITHUB_REF_NAME is version $tag, package is $pkg"; exit 1; }

      # The asset, verified by sha256 against the manifest. A gazetteer that reads
      # back empty redacts every public figure in every essay: privacy-safe,
      # product-hostile, and invisible to every other check.
      - name: Vendor the asset
        run: npm run sync-assets

      - run: npm test

      - name: Conformance must be complete before this package may be published
        run: |
          npm run conformance | tee /tmp/conformance.txt
          # Parse the scoreboard's leading line rather than trusting an exit code:
          # the suite passed at 0 of 36 on purpose, because a ratchet that failed
          # the build for being incomplete would make the port unmergeable. The
          # PUBLISH gate is the stricter one, and it reads the number.
          line=$(grep 'frames requiring masking' /tmp/conformance.txt)
          matched=$(echo "$line" | awk '{print $4}')
          total=$(echo "$line" | awk '{print $6}')
          echo "conformance: $matched of $total masking-required frames"
          test -n "$matched" && test -n "$total" \
            || { echo "could not read the scoreboard — refusing to publish on an unparsed number"; exit 1; }
          test "$matched" = "$total" || {
            echo "REFUSING TO PUBLISH: $matched of $total masking-required frames match"
            echo "the reference output. Publishing now would ship a package named"
            echo "vicary that does not redact, and a caller cannot tell."
            exit 1
          }

      # `npm pack --json` changed shape in npm 12: it emitted an ARRAY of one entry
      # up to npm 11 and emits an OBJECT KEYED BY PACKAGE NAME from 12 on. Reading
      # `[0].files` off the object gives `undefined`, and the step died with
      # "Cannot read properties of undefined" — which reads like a broken tarball
      # and was a broken reader. Both shapes are accepted, and an unrecognised one
      # fails loudly rather than being treated as an empty file list, because "no
      # files" and "cannot see the files" must not reach the same conclusion when
      # the conclusion is whether the gazetteer shipped.
      - name: The packed tarball must carry the asset
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const raw = require("/tmp/pack.json");
            const entry = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!entry || !Array.isArray(entry.files)) {
              console.error("npm pack --json gave a shape this check does not know:");
              console.error(JSON.stringify(raw).slice(0, 400));
              process.exit(1);
            }
            const files = entry.files.map(f => f.path);
            for (const need of ["assets/notability.txt.gz", "assets/MANIFEST.json", "assets/stop_words.txt"]) {
              if (!files.includes(need)) {
                console.error(`tarball is missing ${need}`);
                process.exit(1);
              }
            }
            console.log(`tarball carries the gazetteer asset (${files.length} files)`);
          '

      # The first version of a new npm name cannot be published from here, and that
      # is npm's constraint rather than a gap in this file: trusted publishing is
      # configured on a package's settings page, so a package that does not exist
      # yet cannot be pre-authorized the way PyPI's pending publishers allow. The
      # first version goes up by hand, with an interactive OTP, so no long-lived
      # credential is ever minted; every version after it comes through here.
      #
      # Which leaves exactly one seam: the tag for that hand-published version
      # still fires this workflow, and `npm publish` on an existing version is a
      # hard error. So this asks the registry first. Skipping is reported loudly and
      # only ever for a version the registry ALREADY serves — it cannot turn a
      # failed publish into a green check, because the only thing it accepts as
      # proof is the version being there.
      - name: Skip if this version was published out of band
        id: already
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry — published out of band."
            echo "This run has nothing to do. It is NOT a substitute for a publish"
            echo "that failed: the check is that the registry serves this version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on the registry; publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # THE CREDENTIAL PROBE, and why it does the exchange by hand.
      #
      # Every run of the Publish step below has so far either failed (EOTP, twice,
      # under the deleted token) or been skipped (0.2.1 was hand-published, so the
      # guard above correctly declined). So the OIDC credential this workflow now
      # depends on has never once succeeded, and the first thing that would find
      # out is a real release. This probe is how that stops being true.
      #
      # It does NOT use `npm publish --dry-run`. That looks like the obvious probe
      # and is a false green: npm calls the OIDC exchange unconditionally, before
      # any dry-run branch, but `lib/utils/oidc.js` is documented to *never throw*
      # — every failure path logs at verbose/silly and returns `undefined`, leaving
      # the credential simply unset. The failure surfaces only when the upload is
      # attempted, and a dry run never attempts one. So `--dry-run` passes whether
      # or not the credential works, which is the one thing a probe may not do.
      #
      # Instead it makes the two calls npm would make, where a refusal is a hard
      # failure this step can see: ask GitHub for an ID token with npm's audience,
      # then POST it to the registry's exchange endpoint for this package. A 2xx
      # carrying a token proves the whole trust chain — that this repository, this
      # workflow, and this package's configured trusted publisher actually agree.
      # It proves nothing about the upload itself, which is what the pack and
      # conformance gates above are for.
      #
      # It cannot publish by accident: it never sends a tarball, and the Publish
      # step is skipped outright whenever `publish_probe` is set.
      - name: Prove the trusted-publishing credential without publishing
        if: ${{ inputs.publish_probe }}
        run: |
          registry="https://registry.npmjs.org"
          name=$(node -p "require('./package.json').name")
          # npm escapes the scope separator for this endpoint: @scope/pkg is
          # @scope%2fpkg. Done in shell rather than by requiring npm's own
          # npm-package-arg, so the probe does not depend on npm internals.
          escaped="${name/\//%2f}"

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "no OIDC request credentials in the environment — the job is missing"
            echo "id-token: write. This is the permission npm needs to authenticate."
            exit 1
          fi

          # The audience is `npm:<registry hostname>`, per npm's own client.
          id_token=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).value;if(!v){console.error("no value in id-token response");process.exit(1)}process.stdout.write(v)})')
          test -n "$id_token" || { echo "could not mint a GitHub ID token"; exit 1; }
          # Mask before it can reach a log through any later command's echo.
          echo "::add-mask::$id_token"
          echo "minted a GitHub ID token for audience npm:registry.npmjs.org"

          # The exchange. Capture the body and the status separately so a failure
          # reports the registry's own reason instead of a bare exit code.
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "$registry/-/npm/v1/oidc/token/exchange/package/$escaped")
          http_status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          # 201, not 200. The endpoint MINTS a credential, so `201 Created` is the
          # success it actually returns — the first version of this check demanded
          # 200 and reported a correctly-configured publisher as REFUSED while
          # quoting the very token it had just been issued. Both are accepted
          # rather than only 201, because the substantive proof is the token in the
          # body and the exact 2xx is the registry's business.
          case "$http_status" in
            200 | 201) ;;
            *)
              echo "REFUSED: the registry answered $http_status for $name"
              # Redact before printing. A failing status is not supposed to carry a
              # credential, but this branch has already fired once on a body that
              # did, and a token reaching a public log must not depend on GitHub
              # having guessed to mask it.
              printf '%s' "$body" | head -c 500 | sed -E 's/"token":"[^"]*"/"token":"[REDACTED]"/g'
              echo
              echo "This is the probe's finding: either no trusted publisher is"
              echo "configured on $name, or it does not name this repository,"
              echo "workflow, and environment. A real release would fail here."
              exit 1
              ;;
          esac

          # Never print the token. Assert its presence and report only that.
          printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch{console.error("exchange returned 200 with a body that is not JSON");process.exit(1)}if(!j.token){console.error("exchange returned 200 with no token in the body");process.exit(1)}console.log(`the registry issued a publish credential (${j.token.length} chars, not printed)`)})'

          echo "PROBE PASSED — trusted publishing is correctly configured for $name."
          echo "Nothing was uploaded. A real release would have published from here."

      # No NODE_AUTH_TOKEN. The secret was a classic Publish token, which demands
      # a 2FA OTP that CI cannot supply — it failed with EOTP after signing
      # provenance — and it has been deleted from npm and from this repository.
      # Authentication is OIDC against the trusted publisher configured on the
      # package, which is why the npm version check above is a hard gate.
      #
      # Skipped in probe mode: a probe that could publish is not a probe.
      - name: Publish
        if: ${{ steps.already.outputs.skip == 'false' && !inputs.publish_probe }}
        run: npm publish --provenance --access public
