# Publish to PyPI when a `v*` tag is pushed.
#
# Trusted Publishing (OIDC), so there is no API token in this repository and
# nothing to rotate or leak: PyPI is configured to trust this workflow, in this
# repository, in the `pypi` environment, and mints a short-lived credential per
# run. The one-time setup is on PyPI's side — Publishing -> add a pending
# publisher for project `vicary`, owner `bwthomas`, repo `vicary`, workflow
# `release.yml`, environment `pypi` — and until it exists the publish step fails
# with `invalid-publisher`, which is the correct failure: nothing is uploaded.
#
# The tag is the input, so the tag is checked. `v0.1.1` must match the version
# setuptools will actually build, or the release goes out under a number nobody
# asked for and PyPI will not let it be replaced.
#
# THE FILENAME IS LOAD-BEARING. PyPI's trusted publisher for this project names
# workflow `release.yml`, so renaming this file to `release-python.yml` — which
# would read better in a monorepo — breaks publishing with `invalid-publisher`
# until the publisher is edited on PyPI first. It stays `release.yml` until
# somebody does that in the right order.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_probe:
        description: >-
          Prove the trusted-publishing credential without publishing: mint the
          OIDC token and exchange it with PyPI for an upload credential. Never
          uploads a distribution. Leave this off for a real release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip build twine pytest
      - run: python -m pip install -e ../asset

      # The one number all three front doors share. Its own assertion because the
      # per-package tag check below catches a mistyped tag and cannot catch three
      # packages that each agree with their own tag and disagree with each other.
      - name: Every front door must declare the same version
        run: pytest ../asset/tests/test_version.py -q

      # BEFORE the build. `src/vicary/data/` is gitignored, so a wheel built
      # without this carries no gazetteer and no stoplist — it installs cleanly and
      # loads empty, which means masking every public figure in every essay. The
      # grep further down is what turns that into a failed release.
      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data

      - name: The tag must be the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import sys; sys.path.insert(0, 'src'); \
            import vicary._version as v; print(v.__version__)")
          test "$tag" = "$pkg" \
            || { echo "tag $GITHUB_REF_NAME is version $tag, package is $pkg"; exit 1; }

      - run: python -m build

      - run: python -m twine check dist/*

      # Same assertion CI makes on every push. Repeated here because this is the
      # artifact that actually ships: a wheel without the gazetteer loads empty,
      # which redacts every public figure in every essay — privacy-safe,
      # product-hostile, and invisible until a user reports it.
      - name: The wheel must carry the data asset
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/notability.txt.gz' \
            || { echo "wheel is missing vicary/data/notability.txt.gz"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/MANIFEST.json' \
            || { echo "wheel is missing vicary/data/MANIFEST.json"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/stop_words.txt' \
            || { echo "wheel is missing vicary/data/stop_words.txt"; exit 1; }

      # Install the built wheel into a clean interpreter and redact one sentence
      # through the public entry point. `twine check` reads metadata and proves
      # nothing about whether the thing imports.
      - name: The wheel must install and redact
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/vicary-assets verify
          /tmp/smoke/bin/python -c "import vicary; print(vicary.__version__)"
          # The stoplist is loaded at import and is now package data rather than a
          # literal, so an install that carries the gazetteer and not the lexicon
          # raises here — which is the point of loading it at import.
          /tmp/smoke/bin/python -c "\
          from vicary.name_candidates import _STOP_WORDS; assert len(_STOP_WORDS) == 421, len(_STOP_WORDS)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  # THE GATES, on the path that publishes. Their absence here is why 0.2.3 went
  # to PyPI while RubyGems refused the same commit: `release-gem` runs `rake
  # test`, `release-npm` runs `npm test`, and this workflow ran neither — so the
  # one registry that checked was the only one that could refuse, and which
  # registry got the release was decided by which workflow happened to look.
  #
  # Its own job, on the interpreter the latency baseline was recorded against,
  # so the comparison is entitled to an opinion. The build job stays on 3.11
  # because that is the floor `requires-python` promises and the wheel should be
  # built by it.
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      # Deep, because the latency gate's other half is the PREVIOUS RELEASE's
      # code: the pair below checks it out of this history and times it here,
      # against this checkout, on one machine. A shallow clone has no tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -e ../asset

      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data

      # On a tag, the pair compares against the release BEFORE this one: the
      # driver skips a tag that points at HEAD, because a release compared
      # against itself reports 0% forever and passes every time.
      - name: Latency pair
        run: python ../tools/latency_pair.py --impl python --out "$RUNNER_TEMP/pair.json"

      - name: Gates
        env:
          VICARY_LATENCY_PAIR: ${{ runner.temp }}/pair.json
        run: pytest -m gates -s

  # TAG-GATED, and it was not. This workflow answers `workflow_dispatch` as well
  # as a tag push, and until this guard existed the only thing standing between a
  # manual dispatch and a real PyPI upload was whether the version in `VERSION`
  # happened to already exist on the index. That is not a guard, it is a
  # coincidence: bump the version without tagging, dispatch to check something,
  # and the release publishes itself.
  #
  # All three publish paths had this hole, not just this one. `release-npm` and
  # `release-gem` gate their uploads on a probe input being OFF, which reads like
  # a guard and is not one — a probe is opt-in, so a dispatch that simply leaves
  # it off is the default path. Both now carry the tag condition too, and
  # `tools/tests/test_release_paths.py` fails if any of the three loses it.
  #
  # What this port lacked on top of that is a probe mode, which made it the one
  # path nobody could rehearse. The guard supplies half of it — a dispatch runs
  # the build, the pair and the gates on the real publish path and stops short of
  # the upload — and the `credential_probe` job below supplies the other half.
  publish:
    needs: [build, gates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # THE CREDENTIAL PROBE — the trust chain, exercised without uploading.
  #
  # Everything above proves the artifact: the wheel carries the asset, installs
  # into a clean interpreter, redacts a sentence, and clears the gates. None of it
  # touches the one link that is unique to release day — that PyPI will actually
  # hand this workflow an upload credential. Until this job existed, the first run
  # to find out whether the trusted publisher was registered against the right
  # repository, workflow filename and environment would have been a real release,
  # which is the worst moment to learn the answer. `release-npm` and `release-gem`
  # each had a probe for exactly this reason; this path did not.
  #
  # It does NOT use `gh-action-pypi-publish` in any dry-run mode, for the reason
  # the npm probe spells out about `npm publish --dry-run`: a mode that skips the
  # upload generally skips the exchange too, so it passes whether or not the
  # credential works — the one thing a probe may not do. Instead it makes the two
  # calls the action makes, where a refusal is a hard failure this step can see:
  # ask GitHub for an ID token with PyPI's audience, then POST it to PyPI's
  # mint-token endpoint. A 200 carrying a token proves the whole chain.
  #
  # ENVIRONMENT AND FILENAME ARE LOAD-BEARING, and that is the point of running
  # the probe here rather than in a scratch workflow. PyPI matches the OIDC claims
  # against a publisher registered for repository `bwthomas/vicary`, workflow
  # `release.yml` and environment `pypi`. A probe that ran anywhere else would
  # prove something about a trust relationship nobody uses.
  #
  # It cannot publish by accident: it never builds or sends a distribution, it
  # does not run `twine`, and the minted credential is masked and discarded with
  # the job. The `publish` job above is tag-gated, so a dispatch cannot reach it.
  credential_probe:
    if: ${{ inputs.publish_probe }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Say what this run is
        run: |
          echo "CREDENTIAL PROBE — nothing will be uploaded. This job proves PyPI"
          echo "will mint an upload credential for this workflow, and then stops."

      - name: Prove the trusted-publishing credential without publishing
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no OIDC request credentials in the environment — the job is missing"
            echo "id-token: write, which is the permission PyPI's exchange needs."
            exit 1
          fi

          # Asked for rather than hardcoded, the way the action does it: the
          # audience is PyPI's to choose, and a stale constant here would fail as
          # though the publisher were misconfigured.
          audience=$(curl -sS --fail-with-body https://pypi.org/_/oidc/audience \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])')
          test -n "$audience" || { echo "PyPI did not name an audience"; exit 1; }
          echo "PyPI names its audience: $audience"

          id_token=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json,sys; v=json.load(sys.stdin).get("value") or sys.exit("no value in id-token response"); sys.stdout.write(v)')
          test -n "$id_token" || { echo "could not mint a GitHub ID token"; exit 1; }
          # Mask before it can reach a log through any later command's echo.
          echo "::add-mask::$id_token"
          echo "minted a GitHub ID token for audience $audience"

          # The exchange. Status and body captured separately so a refusal reports
          # PyPI's own reason rather than a bare exit code — the difference between
          # "the publisher is not registered" and "we sent a malformed token" is
          # the whole diagnostic value of this step.
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"token\": \"${id_token}\"}" \
            https://pypi.org/_/oidc/mint-token)
          http_status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          if [ "$http_status" != "200" ]; then
            echo "PyPI refused to mint an upload credential (HTTP $http_status)."
            echo "--- PyPI said ---"
            printf '%s\n' "$body"
            echo "-----------------"
            echo
            echo "invalid-publisher means no trusted publisher matches this run's"
            echo "claims: check repository, workflow filename (release.yml) and"
            echo "environment (pypi) on PyPI's Publishing page. invalid-payload"
            echo "means the token this step sent was malformed, which is a bug here"
            echo "rather than a misconfiguration there."
            exit 1
          fi

          # Masked, then checked for shape only. The token is a real upload
          # credential for this project — short-lived, but real — so nothing about
          # it beyond its length is printed.
          token=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')
          test -n "$token" || { echo "200 from PyPI but no token in the body"; exit 1; }
          echo "::add-mask::$token"
          case "$token" in
            pypi-*) : ;;
            *) echo "PyPI returned a credential that is not shaped like an upload token"; exit 1 ;;
          esac
          echo "PyPI minted an upload credential for this workflow: ${#token} characters, prefix pypi-"
          echo
          echo "The trust chain holds: repository, workflow file and environment all"
          echo "match the publisher PyPI has registered. Nothing was uploaded."
