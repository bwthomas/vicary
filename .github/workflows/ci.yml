# The gates are tests so that CI runs them whether anybody remembers or not.
# That rationale is written into python/tests/test_gates.py and was unfulfilled
# until this file existed: nothing ran them but a human at a terminal.
#
# What CI measures: all nine gates, in every port, on a plain checkout with no
# secrets and no operator setup. The four that declare a data requirement read it
# out of the repository — `conformance/corpora/` ships an essay corpus and
# `conformance/census/` ships the US surname table — so there is one CI
# configuration rather than a measured subset plus a note about the rest.
#
# It was not always so. A public runner used to measure five of nine, and the
# gap was structural: the corpus was un-redistributable and the Census file came
# from census.gov, which now answers its own documented URL with a rejection page
# under a 200 status. Both are shipped now, and neither is in any published
# package.
#
# `-s` is still passed so the gate report reaches the log, and the report still
# prints NOT MEASURED by name for any gate it cannot reach. A green CI run now
# means the gate set is clear — but it says which gates it measured, so that
# remains a claim a reader can check rather than one the badge asserts.
#
# One workflow covers every language front door on purpose. The product claim is
# that all three produce byte-identical output, and a claim split across three
# repositories' CI is a claim nobody checks. Each package gets its own job so a
# failure names the language; the conformance job is what makes them one package.
#
# FOUR suites, not three. `python`, `typescript` and `ruby` are the front doors —
# three implementations of one detector, held to the same coverage and compared
# against each other. `tools` is everything underneath them: the eval fixture all
# three are scored against, the gazetteer builder, and the generator behind
# `conformance/*.json`. It used to run as two steps inside the `python` job purely
# because it is written in Python, which made the Python front door look like it
# had twice the coverage of the other two — at the time of the split, 435 of its
# 773 collected tests were tooling — and named Python as the culprit for breakages
# that were nothing to do with it.
#
# Those two figures are historical and are NOT the current counts; `just coverage`
# prints what is true now. The three front doors still report different totals
# (granularity and scope, not depth), which is why the board prints concerns rather
# than sums — see the docstring on `tools/tests/test_coverage_parity.py`.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the newest interpreter. The
        # redaction path is stdlib-only, so the interesting breakage is a `re`
        # or `enum` behaviour change between versions rather than a dependency.
        python-version: ["3.11", "3.13"]

    steps:
      # Deep, because the latency gate's other half is the PREVIOUS RELEASE's
      # code: `tools/latency_pair.py` checks it out of this history into a
      # worktree and times it here. A shallow clone has no tags and no v0.2.4.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -e ../asset

      # BEFORE anything imports vicary. `src/vicary/data/` is gitignored in this
      # package exactly as it is in the other two, so a fresh checkout has no
      # gazetteer and no stoplist until this runs — and importing vicary raises
      # rather than answering from an empty one, which is the intended failure.
      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src/vicary

      - name: Unit tests
        run: pytest -m "not gates" -q

      # The latency gate's other half, measured HERE: the previous release and
      # this checkout, timed alternately on this runner. Both sides face the
      # same machine, so the machine cancels — which is the whole design, and
      # the reason nothing is recorded between releases any more.
      #
      # One matrix entry rather than all of them, and now for COST rather than
      # for validity: the pair is sound on any runner and any interpreter,
      # because it never compares across machines. It just takes half a minute,
      # and the question it answers is about the code, which does not differ
      # between matrix entries.
      - name: Latency pair
        if: matrix.python-version == '3.13'
        run: python ../tools/latency_pair.py --impl python --out "$RUNNER_TEMP/pair.json"

      # Separate step so a gate regression is distinguishable from a unit-test
      # failure at a glance in the checks list, and so the printed numbers land
      # in a log section of their own. Without the pair the latency gate
      # measures, prints, and reports NOT MEASURED with the reason attached.
      - name: Gates
        env:
          VICARY_LATENCY_PAIR: ${{ matrix.python-version == '3.13' && format('{0}/pair.json', runner.temp) || '' }}
        run: pytest -m gates -s

      - name: Asset integrity
        run: vicary-assets verify

  # The fourth suite. Everything that is not one of the three redactors: the eval
  # fixture all three are scored against, the over-fire harness, the gazetteer
  # builder, and the generator behind conformance/*.json.
  #
  # Its own job rather than a step in `python`, because a failure here means
  # something different. A red `python` job means the Python redactor broke and
  # the other two are probably fine. A red `tools` job means either the next
  # asset build would be wrong, or the spec the OTHER TWO check themselves
  # against no longer describes anything — which fails all three ports at once,
  # or passes all three against nothing. Reading that off a step buried in the
  # Python job named the wrong culprit every time.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[dev]'
          python -m pip install -e ./asset
      # `vicary.eval.fixture` imports the classifier, which loads the asset.
      - name: Vendor the asset
        run: python -m vicary_build vendor python/src/vicary/data
      - name: Lint
        run: ruff check tools/tests tools/coverage_board.py asset/vicary_build asset/tests
      # Two directories, one suite — `asset/tests` sits beside the installable
      # package it tests, the rest has no package to sit beside.
      - name: Tools tests
        run: pytest tools/tests asset/tests -q
      # Its own step because a stale spec is a different failure from a broken
      # generator: it means the file the other two front doors check themselves
      # against no longer describes this one, and both of them would go green
      # while diverging. `just sync-conformance` is the fix.
      - name: Conformance spec is current
        run: pytest tools/tests/test_conformance.py -q
      # Printed, not asserted — `Tools tests` above is what enforces the shape via
      # test_coverage_parity.py. This puts the board in the log for the same reason
      # the gate board is there: a number nobody can see is a number nobody checks,
      # and the three suites' differing totals are exactly what this reconciles.
      - name: Coverage by concern
        run: python tools/coverage_board.py

  python-build:
    # A packaging break is invisible to the test suite and only shows up for
    # whoever runs `pip install` first. Cheap to catch here instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ../asset
      # Without this the wheel builds cleanly and carries no asset at all. The
      # grep below is what makes that a failure rather than a release.
      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data
      - run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: The wheel must carry the data asset
        # An sdist/wheel that builds cleanly but ships no gazetteer loads empty,
        # which means redacting every public figure in every essay — privacy-safe,
        # product-hostile, and indistinguishable from over-tuning for months.
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/notability.txt.gz' \
            || { echo "wheel is missing vicary/data/notability.txt.gz"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/MANIFEST.json' \
            || { echo "wheel is missing vicary/data/MANIFEST.json"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/stop_words.txt' \
            || { echo "wheel is missing vicary/data/stop_words.txt"; exit 1; }

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current LTS. The redaction path
        # is standard library only, so the interesting breakage is a RegExp or
        # Intl behaviour change between versions rather than a dependency.
        node-version: ["20", "22"]
    steps:
      # Deep: the pair below times the PREVIOUS RELEASE's code, checked out of
      # this history. A shallow clone has no tags and nothing to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # Vendors the asset from the repository's `asset/` — which is not inside any
      # package — and verifies the sha256 of what landed. Its own step because "the
      # copy succeeded" and "the copy is the right bytes" are different claims, and
      # only the second one matters.
      - name: Vendor the asset
        run: npm run sync-assets
      - run: npx tsc -p tsconfig.json --noEmit
      # `--noEmit` above type-checks and writes nothing; the pair times compiled
      # output, so it needs a real build of this side. The previous release is
      # compiled by this checkout's tsc against these node_modules, so neither
      # side reaches the registry.
      - name: Build
        if: matrix.node-version == '22'
        run: npm run build
      # The latency gate's other half, measured HERE: the previous release and
      # this checkout, timed alternately on this runner. Both sides face the same
      # machine, so the machine cancels. This port takes three times as many
      # rounds as the others because its per-process noise is three times theirs
      # — 2 ms measurements and a JIT that does not settle identically twice.
      #
      # One matrix entry rather than both, and for COST rather than validity: the
      # pair never compares across machines, so it is sound anywhere.
      - name: Latency pair
        if: matrix.node-version == '22'
        run: python3 ../tools/latency_pair.py --impl typescript --out "$RUNNER_TEMP/pair.json"
      - run: npm test
        env:
          VICARY_LATENCY_PAIR: ${{ matrix.node-version == '22' && format('{0}/pair.json', runner.temp) || '' }}
      # Printed as its own step so the scoreboard is readable in the checks list
      # without expanding a test log. It reports 0 of 35 until the detector lands,
      # which is the honest number and the reason it is printed at all.
      - name: Conformance scoreboard
        run: npm run conformance

  # Diffs each port's answers against the reference directly, on seams neither
  # shared corpus can reach: frames.json and primitives.json are both
  # single-line, and several rules only diverge across a newline. That is not
  # hypothetical — of eleven deliberate mutations to the Ruby detector, the
  # frames caught one and the primitives caught seven, and the one that escaped
  # both was a regex end-anchor that only misbehaves after a line break.
  #
  # One job for both ports because both need the Python reference installed
  # beside them; a probe with only one implementation present is a script that
  # agrees with itself.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ruby

      # The probes shell out to `python/.venv/bin/python` by path, so the venv
      # has to exist at that path rather than merely being on PATH.
      - name: Install the reference
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e ./python -e ./asset
          python/.venv/bin/python -m vicary_build vendor python/src/vicary/data

      - name: Vendor the asset into both ports
        run: |
          cd typescript && npm ci && npm run sync-assets && cd ..
          cd ruby && rake sync_assets

      - name: TypeScript against the reference
        run: cd typescript && npm run --silent parity

      - name: Ruby against the reference
        run: cd ruby && rake parity && rake redaction_parity

  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.3"]
    steps:
      # Deep: the pair below times the PREVIOUS RELEASE's code, checked out of
      # this history. A shallow clone has no tags and nothing to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: ruby
      - name: Vendor the asset
        run: rake sync_assets
      # The latency gate's other half, measured HERE: the previous release and
      # this checkout, timed alternately on this runner. Both sides face the same
      # machine, so the machine cancels — which matters most in this port, where
      # identical code spread 67% across six of GitHub's own runners.
      #
      # One matrix entry rather than both, and for COST rather than validity.
      - name: Latency pair
        if: matrix.ruby-version == '3.3'
        run: python3 ../tools/latency_pair.py --impl ruby --out "$RUNNER_TEMP/pair.json"
      - run: rake test
        env:
          VICARY_LATENCY_PAIR: ${{ matrix.ruby-version == '3.3' && format('{0}/pair.json', runner.temp) || '' }}
      - name: Conformance scoreboard
        run: rake conformance
