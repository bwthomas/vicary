# The gates are tests so that CI runs them whether anybody remembers or not.
# That rationale is written into python/tests/test_gates.py and was unfulfilled
# until this file existed: nothing ran them but a human at a terminal.
#
# What CI can and cannot measure. Four of the nine gates need data that is not
# packaged — three need an essay corpus the operator supplies, one needs the Census
# surname file — so a public runner measures five. That is not papered over: `-s`
# is passed so the gate report reaches the log, and it prints NOT MEASURED for
# the four it could not reach. A green CI run therefore means "the corpus-free
# gates hold", never "the gate set is clear".
#
# One workflow covers every language front door on purpose. The product claim is
# that all three produce byte-identical output, and a claim split across three
# repositories' CI is a claim nobody checks. Each package gets its own job so a
# failure names the language; the conformance job is what makes them one package.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the newest interpreter. The
        # redaction path is stdlib-only, so the interesting breakage is a `re`
        # or `enum` behaviour change between versions rather than a dependency.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -e ../asset

      # BEFORE anything imports vicary. `src/vicary/data/` is gitignored in this
      # package exactly as it is in the other two, so a fresh checkout has no
      # gazetteer and no stoplist until this runs — and importing vicary raises
      # rather than answering from an empty one, which is the intended failure.
      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data

      - name: Lint
        run: |
          ruff check src tests
          ruff check ../asset/vicary_build ../asset/tests

      # The build mechanism's own suite. It is not part of any front door — it is
      # the thing all three consume — so a break here is a different failure from a
      # detector break and gets its own step.
      - name: Build-mechanism tests
        run: pytest ../asset/tests -q

      - name: Type-check
        run: mypy src/vicary

      - name: Unit tests
        run: pytest -m "not gates" -q

      # Its own step because a stale spec is a different failure from a broken
      # detector: it means the file the OTHER two front doors check themselves
      # against no longer describes this one, and both of them would go green
      # while diverging. `just sync-conformance` is the fix.
      - name: Conformance spec is current
        run: pytest tests/test_conformance.py -q

      # Separate step so a gate regression is distinguishable from a unit-test
      # failure at a glance in the checks list, and so the printed numbers land
      # in a log section of their own.
      - name: Gates
        run: pytest -m gates -s

      - name: Asset integrity
        run: vicary-assets verify

  python-build:
    # A packaging break is invisible to the test suite and only shows up for
    # whoever runs `pip install` first. Cheap to catch here instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ../asset
      # Without this the wheel builds cleanly and carries no asset at all. The
      # grep below is what makes that a failure rather than a release.
      - name: Vendor the asset
        run: python -m vicary_build vendor src/vicary/data
      - run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: The wheel must carry the data asset
        # An sdist/wheel that builds cleanly but ships no gazetteer loads empty,
        # which means redacting every public figure in every essay — privacy-safe,
        # product-hostile, and indistinguishable from over-tuning for months.
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/notability.txt.gz' \
            || { echo "wheel is missing vicary/data/notability.txt.gz"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/MANIFEST.json' \
            || { echo "wheel is missing vicary/data/MANIFEST.json"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'vicary/data/stop_words.txt' \
            || { echo "wheel is missing vicary/data/stop_words.txt"; exit 1; }

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current LTS. The redaction path
        # is standard library only, so the interesting breakage is a RegExp or
        # Intl behaviour change between versions rather than a dependency.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # Vendors the asset from the repository's `asset/` — which is not inside any
      # package — and verifies the sha256 of what landed. Its own step because "the
      # copy succeeded" and "the copy is the right bytes" are different claims, and
      # only the second one matters.
      - name: Vendor the asset
        run: npm run sync-assets
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      # Printed as its own step so the scoreboard is readable in the checks list
      # without expanding a test log. It reports 0 of 35 until the detector lands,
      # which is the honest number and the reason it is printed at all.
      - name: Conformance scoreboard
        run: npm run conformance

  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: ruby
      - name: Vendor the asset
        run: rake sync_assets
      - run: rake test
      - name: Conformance scoreboard
        run: rake conformance
