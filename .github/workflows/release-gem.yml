# Publish the gem when a `v*` tag is pushed — and prove the push path before then.
#
# RubyGems trusted publishing (OIDC), so there is no API key in this repository:
# rubygems.org is configured to trust this workflow, in this repository, in the
# `rubygems` environment, and mints a short-lived credential per run. The one-time
# setup is on RubyGems' side — the gem's Trusted Publishers page, or a pending
# publisher for a gem that does not exist yet — and until it exists the publish
# step fails, which is the correct failure: nothing is uploaded.
#
# THE GATE THAT MATTERS IS CONFORMANCE, NOT THE TESTS.
#
# A port that publishes while it reproduces 0 of 38 masking-required frames is a
# gem called `vicary` that does not redact — worse than no gem, because a host that
# installs it gets silence instead of an error. So this refuses to publish unless
# the conformance scoreboard reports every masking-required frame matching the
# reference output byte-for-byte. Until the detector is ported, a `v*` tag builds,
# tests, prints the scoreboard, and stops. That is the correct outcome.
#
# ---------------------------------------------------------------------------
# THE PUSH PROBE — how this path gets exercised without publishing
# ---------------------------------------------------------------------------
#
# The problem: every link in this workflow between "the gem is built" and "the
# registry serves it" is unproven until a release runs, and the first release
# cannot happen until the detector is ported. Which means the first time the
# credential exchange runs for real would also be the first time anyone learns
# whether the trusted publisher was registered against the right repository,
# workflow filename and environment. That is the wrong moment to find out.
#
# So `push_probe: true` runs this same workflow, in this same environment, from
# this same file — all three of which the OIDC claims are matched against — mints
# a real credential, and then attempts a `gem push` that RubyGems is *guaranteed*
# to refuse.
#
# The guarantee is not a convention, it is rubygems.org's own authorization code.
# `Pusher#authorize` clears a push from a trusted-publisher-owned key by exactly
# two routes: the publisher already owns the gem, or there is an unexpired
# *pending* publisher whose gem name matches this one exactly. The probe gem's
# name matches no pending publisher and is owned by nobody, so both routes are
# closed and the push is refused with a 403 and the body "You are not allowed to
# push this gem." — an authenticated refusal, reached only after the credential
# was accepted.
#
# A probe run that ends in that refusal has therefore proven, end to end:
#
#   * a trusted publisher exists whose repository, owner id, workflow filename,
#     environment and audience all match this workflow's OIDC claims — otherwise
#     the exchange raises RecordNotFound and the action fails;
#   * a short-lived push credential was minted and written where `gem push` looks
#     for it;
#   * `gem push` reached rubygems.org over the real transport and the credential
#     authenticated — a rejected or absent one returns 401 "Access Denied", which
#     this step treats as a failure and says so;
#   * the artifact steps above it all ran on the real runner.
#
# What it does not prove is the single branch that publishes, which by
# construction only opens for `vicary` itself. That one was provable only by
# publishing, and 0.2.0 published it: probe first, then a dispatch with
# `push_probe` off, which pushed the gem and then read it back off the registry.
# Both branches have now run. The probe stays because it is the only one of the
# two that can be re-run at will, on any change to this file, without spending a
# version number to find out whether the credential path still works.
#
# The probe cannot publish anything by accident. Three independent reasons: the
# server refuses it (above); the probe gem is built under RUNNER_TEMP so the
# publish step's `vicary-*.gem` glob cannot reach it; and the publish step is
# skipped outright whenever `push_probe` is set.
name: release-gem

# The tag trigger is back, in the commit that raised the ratchet to 36 of 36 —
# which is exactly the deal the note here used to describe. It was removed because
# the conformance gate would have refused on every `v*` tag while the port was
# unfinished, which means a permanent red check on every Python release, and "is
# the release green?" stops having an answer. The gate itself is unchanged and
# still reads the number off the scoreboard; what changed is that the number is
# now 36.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_probe:
        description: >-
          Prove the push path without publishing: mint the trusted-publishing
          credential and attempt a push RubyGems is guaranteed to refuse. Never
          uploads a gem. Leave this off for a real release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    defaults:
      run:
        working-directory: ruby
    permissions:
      contents: read
      id-token: write
    steps:
      # Deep: the pair times the PREVIOUS RELEASE's code, checked out of this
      # history. A shallow clone has no tags and nothing to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Say which of the two things this run is
        run: |
          if [ "${{ inputs.push_probe }}" = "true" ]; then
            echo "PUSH PROBE — nothing will be uploaded. The push below is expected to be"
            echo "REFUSED by rubygems.org, and this job fails if it is not."
          else
            echo "RELEASE — this run publishes the gem if the conformance gate clears."
          fi

      - name: The tag must be the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ruby -Ilib -e 'require "vicary/version"; print Vicary::VERSION')
          test "$tag" = "$pkg" \
            || { echo "tag $GITHUB_REF_NAME is version $tag, gem is $pkg"; exit 1; }

      # The asset, verified by sha256 against the manifest. A gazetteer that reads
      # back empty redacts every public figure in every essay: privacy-safe,
      # product-hostile, and invisible to every other check.
      - name: Vendor the asset
        run: rake sync_assets

      # The latency gate's other half. Without it `rake test` measured the number
      # and reported NOT MEASURED — on the one publish path that had ever refused
      # a release for being slow. The pair times the previous release HERE, on
      # this runner, against this checkout; on a tag it compares against the
      # release BEFORE this one, because the driver skips a tag pointing at HEAD.
      - name: Latency pair
        run: python3 ../tools/latency_pair.py --impl ruby --out "$RUNNER_TEMP/pair.json"

      - run: rake test
        env:
          VICARY_LATENCY_PAIR: ${{ runner.temp }}/pair.json

      # The gate lives in `scripts/release_gate.rb` rather than in shell here,
      # because it reads the scoreboard object the harness returns instead of
      # scraping a column out of a human-readable report — and because
      # `test/release_test.rb` then drives its allow branch, which no run in this
      # repository has ever reached. A gate that has only ever refused is
      # indistinguishable from a gate that is stuck shut.
      #
      # In probe mode it reports and does not block: the probe's whole purpose is
      # to reach the credential steps below while the port is incomplete. It is
      # not a bypass — the step that publishes is skipped in probe mode, so there
      # is no path from here to an upload.
      - name: Conformance must be complete before this gem may be published
        run: |
          if [ "${{ inputs.push_probe }}" = "true" ]; then
            ruby -Ilib scripts/release_gate.rb --report-only
          else
            ruby -Ilib scripts/release_gate.rb
          fi

      - name: Build, and the gem must carry the asset
        run: |
          gem build vicary.gemspec
          tar -tf vicary-*.gem >/dev/null
          # `gem build` lists what it packed, but reading the built artifact is the
          # claim that matters: a gemspec glob that stops matching is silent.
          tar -xOf vicary-*.gem data.tar.gz | tar -tzf - > /tmp/members.txt
          for need in assets/notability.txt.gz assets/MANIFEST.json assets/stop_words.txt; do
            grep -qx "$need" /tmp/members.txt \
              || { echo "gem is missing $need"; exit 1; }
          done
          echo "gem carries the gazetteer asset"

      # Built under RUNNER_TEMP on purpose. Its name begins with `vicary-`, so if
      # it sat beside the real gem the publish step's `vicary-*.gem` glob would
      # match it — and the one thing a probe must never do is change what a
      # release uploads.
      - name: Build the gem the registry is expected to refuse
        if: ${{ inputs.push_probe }}
        run: |
          probe="$RUNNER_TEMP/push-probe"
          mkdir -p "$probe/lib"
          cat > "$probe/lib/vicary_trusted_publishing_probe.rb" <<'RUBY'
          # Never published. See .github/workflows/release-gem.yml.
          RUBY
          cat > "$probe/probe.gemspec" <<'SPEC'
          Gem::Specification.new do |spec|
            spec.name = "vicary-trusted-publishing-probe"
            spec.version = "0.0.0"
            spec.authors = ["Blake Thomas"]
            spec.email = ["bwthomas@gmail.com"]
            spec.summary = "Never published. Exists to be refused by rubygems.org."
            spec.description = "A probe artifact. rubygems.org refuses this push because " \
                               "no pending trusted publisher claims this name, which is how " \
                               "the release workflow proves its credential authenticates " \
                               "without publishing anything."
            spec.homepage = "https://github.com/bwthomas/vicary"
            spec.license = "MIT"
            spec.required_ruby_version = ">= 3.1"
            spec.files = ["lib/vicary_trusted_publishing_probe.rb"]
            spec.require_paths = ["lib"]
          end
          SPEC
          cd "$probe" && gem build probe.gemspec
          ls -l "$probe"/*.gem

      # Credentials from the workflow's OIDC identity. This step failing IS the
      # probe's first finding: it means no trusted publisher on rubygems.org
      # matches this repository, this workflow filename and this environment.
      #
      # NOT `rubygems/release-gem`, which was here first and would have failed on
      # this repository's first gem release in four separate ways. That action
      # runs `bundle exec rake release`, which wants: a Gemfile (there is none —
      # the gem has no runtime dependencies, deliberately); a `release` task from
      # `bundler/gem_tasks` (the Rakefile does not require it); `contents: write`,
      # because `rake release` pushes a git tag; and a `working-directory` input,
      # because a job-level `defaults.run.working-directory` does not reach inside
      # a composite action. It would also have re-tagged a version whose tag is
      # the very thing that triggered the run.
      #
      # None of that is wanted here. The tag already exists, the gem is already
      # built, and its contents are already verified. What is left is the upload.
      # Pinned to an exact version because this repository publishes no moving
      # major tag: `refs/tags/v1` and `refs/tags/v2` do not exist, only `v1.0.0`,
      # `v2.0.0` and `v2.1.0`, so `@v2` resolves to nothing and the step fails to
      # load. This is the same commit `rubygems/release-gem@v1` pins internally.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: The credential exists
        run: |
          test -n "$GEM_HOST_API_KEY" \
            || { echo "the OIDC exchange returned no API key"; exit 1; }
          test -f ~/.gem/credentials \
            || { echo "no ~/.gem/credentials — gem push would fall back to nothing"; exit 1; }
          echo "a short-lived credential was minted and written where gem push reads it"

      # The probe. A refusal here is the pass.
      - name: The registry must authenticate us and then refuse this gem
        if: ${{ inputs.push_probe }}
        run: |
          probe="$RUNNER_TEMP/push-probe"
          set +e
          out=$(gem push "$probe/vicary-trusted-publishing-probe-0.0.0.gem" 2>&1)
          status=$?
          set -e
          echo "--- gem push said ---"
          echo "$out"
          echo "---------------------"

          if [ "$status" -eq 0 ]; then
            echo "FAIL: rubygems.org ACCEPTED a push it was expected to refuse."
            echo "Something named vicary-trusted-publishing-probe may now exist on the"
            echo "registry. Yank it, and do not trust this workflow's safety argument"
            echo "until the reason is understood."
            exit 1
          fi

          case "$out" in
            *"You are not allowed to push this gem"*)
              echo "PASS: the credential authenticated and rubygems.org refused the gem"
              echo "at the ownership check — which is exactly as far as a push can get"
              echo "for a name no pending publisher claims. The trusted publisher is"
              echo "configured correctly for this repository, workflow and environment."
              ;;
            *"Access Denied"*|*"sign up for an account"*)
              echo "FAIL: rubygems.org did not accept the credential (401). The OIDC"
              echo "exchange produced a key the API will not authenticate."
              exit 1
              ;;
            *"This gem name is reserved"*)
              echo "PASS, with a note: authenticated, but refused for the name being"
              echo "reserved rather than at the ownership check. Rename the probe gem"
              echo "so it exercises the ownership branch a real push takes."
              ;;
            *)
              echo "FAIL: the push was refused for a reason this step does not recognise."
              echo "Read the body above before concluding anything about the release path."
              exit 1
              ;;
          esac

      # Tag-gated as well as probe-gated, and the two are different claims. Probe
      # mode is opt-in, so a dispatch that simply left it off went straight to
      # `gem push`, protected only by RubyGems refusing a version it already
      # serves — a coincidence rather than a guard, and one that stops holding the
      # moment the version is bumped without a tag. A release comes from a tag or
      # it does not happen.
      - name: Push the gem
        if: ${{ !inputs.push_probe && startsWith(github.ref, 'refs/tags/v') }}
        run: gem push vicary-*.gem

      # `gem push` reporting success is the system describing itself. Ask the
      # registry instead — the same reason the wheel is installed into a clean
      # interpreter over in release.yml rather than trusted to `twine check`.
      # The polling and the payload parsing live in a script so that the
      # difference between "not published yet" and "I could not tell" is a tested
      # distinction rather than a `|| true` in a pipeline.
      - name: RubyGems must actually be serving the version we just pushed
        if: ${{ !inputs.push_probe && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(ruby -Ilib -e 'require "vicary/version"; print Vicary::VERSION')
          ruby scripts/registry_serves.rb --attempts 12 --interval 10 vicary "$version"
